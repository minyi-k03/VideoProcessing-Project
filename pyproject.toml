[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sr-pipeline"
version = "0.1.0"
description = "x4 Super-Resolution controlled experiment pipeline for Sangmyung Univ. Video Processing final project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision>=0.16",
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "lpips>=0.1.4",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
